<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MPI PAI Kelas 4 - Q.S. Al-Ḥujurāt/49:13 &amp; Hadis Keragaman</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js untuk Efek Suara Edukatif Ramah Anak -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- Google Fonts: Fredoka (Display), Nunito (Body), Amiri (Teks Arab) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #F0F9FF;
      --bg-surface: #FFFFFF;
      --bg-soft: #E0F2FE;
      --brand-teal: #0D9488;
      --brand-teal-dark: #0F766E;
      --brand-blue: #0284C7;
      --accent-amber: #F59E0B;
      --accent-amber-dark: #D97706;
      --accent-coral: #F97316;
      --text-dark: #1E293B;
      --text-muted: #475569;
      --success: #16A34A;
      --error: #DC2626;
      --radius-card: 24px;
      --radius-btn: 18px;
      --transition-speed: 0.28s;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-dark);
      margin: 0;
      padding: 0;
      line-height: 1.65;
      font-size: 17px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(13, 148, 136, 0.08) 0%, transparent 35%),
        radial-gradient(circle at 90% 85%, rgba(245, 158, 11, 0.1) 0%, transparent 40%);
    }

    @media (min-width: 1280px) {
      body {
        font-size: 19px;
      }
    }

    h1, h2, h3, .font-display {
      font-family: 'Fredoka', sans-serif;
      letter-spacing: 0.01em;
    }

    .font-arab {
      font-family: 'Amiri', serif;
      direction: rtl;
      line-height: 2.3;
    }

    /* Target Sentuh FID & Mobile minimal 60x60px untuk elemen aksi */
    .touch-target {
      min-height: 60px;
      min-width: 60px;
      transition: transform var(--transition-speed) ease, background-color var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
    }

    .touch-target:active {
      transform: scale(0.96);
    }

    /* Tombol 3D Taktil Ramah Anak */
    .btn-3d-amber {
      background: linear-gradient(180deg, #FBBF24 0%, #F59E0B 100%);
      color: #1E293B;
      border-bottom: 5px solid #B45309;
      box-shadow: 0 8px 18px rgba(245, 158, 11, 0.32);
    }
    .btn-3d-amber:active {
      border-bottom-width: 2px;
      transform: translateY(3px);
    }

    .btn-3d-teal {
      background: linear-gradient(180deg, #14B8A6 0%, #0D9488 100%);
      color: #FFFFFF;
      border-bottom: 5px solid #115E59;
      box-shadow: 0 8px 18px rgba(13, 148, 136, 0.28);
    }
    .btn-3d-teal:active {
      border-bottom-width: 2px;
      transform: translateY(3px);
    }

    .btn-3d-blue {
      background: linear-gradient(180deg, #38BDF8 0%, #0284C7 100%);
      color: #FFFFFF;
      border-bottom: 5px solid #075985;
      box-shadow: 0 8px 18px rgba(2, 132, 199, 0.25);
    }
    .btn-3d-blue:active {
      border-bottom-width: 2px;
      transform: translateY(3px);
    }

    /* Animasi Feedback Edukatif Ringan */
    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      70% { transform: translateY(-4px); }
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      50% { transform: translateX(7px); }
      75% { transform: translateX(-5px); }
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .anim-bounce { animation: gentleBounce 0.55s ease; }
    .anim-shake { animation: gentleShake 0.45s ease; }
    .page-enter { animation: fadeSlideIn 0.35s ease forwards; }

    /* Custom Scrollbar Halus */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #E0F2FE; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #7DD3FC; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #0284C7; }

    /* Garis bantu menulis huruf hijaiyah */
    .writing-paper {
      background-image: repeating-linear-gradient(
        transparent,
        transparent 58px,
        #BAE6FD 59px,
        #BAE6FD 60px
      );
    }

    /* Hide scrollbar pada menu horizontal */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- HEADER & NAVIGASI UTAMA (9 Menu Konsisten) -->
  <header id="mainHeader" class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b-2 border-sky-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2 flex flex-col gap-2">
      <!-- Bar Atas: Identitas Singkat & Skor Gamifikasi -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <div class="w-11 h-11 rounded-2xl bg-teal-600 text-white flex items-center justify-center font-display font-bold text-xl shadow-sm">
            📖
          </div>
          <div>
            <span class="text-xs font-extrabold uppercase tracking-wider text-teal-700 bg-teal-50 px-2.5 py-0.5 rounded-full">PAI SD Kelas 4 • Fase B</span>
            <h1 class="text-sm sm:text-base font-bold text-slate-800 leading-tight">Q.S. Al-Ḥujurāt/49:13 &amp; Keragaman</h1>
          </div>
        </div>

        <!-- Panel Poin, Suara, & Progress -->
        <div class="flex items-center gap-2">
          <button id="btnToggleSound" onclick="toggleAudio()" aria-label="Suara Efek" class="touch-target !min-w-[48px] !min-h-[48px] px-3 rounded-2xl bg-sky-100 text-sky-800 font-bold flex items-center gap-1.5 border-2 border-sky-200">
            <span id="soundIcon">🔊</span>
            <span class="hidden sm:inline text-sm" id="soundLabel">Suara Aktif</span>
          </button>
          <div class="bg-amber-100 border-2 border-amber-300 px-3.5 py-1.5 rounded-2xl flex items-center gap-1.5 shadow-inner">
            <span class="text-xl">⭐</span>
            <span id="globalScore" class="font-display font-bold text-amber-900 text-lg">0</span>
          </div>
        </div>
      </div>

      <!-- Bar Navigasi 9 Menu Utama -->
      <nav aria-label="Menu Utama" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
        <button onclick="navigateTo('beranda')" data-nav="beranda" class="nav-btn touch-target !min-h-[48px] px-3.5 py-2 rounded-2xl font-bold text-sm sm:text-base whitespace-nowrap flex items-center gap-1.5 border-2 border-transparent">
          <span>🏠</span><span>Beranda</span>
        </button>
        <button onclick="navigateTo('materi')" data-nav="materi" class="nav-btn touch-target !min-h-[48px] px-3.5 py-2 rounded-2xl font-bold text-sm sm:text-base whitespace-nowrap flex items-center gap-1.5 border-2 border-transparent">
          <span>📖</span><span>Materi</span>
        </button>
        <button onclick="navigateTo('aktivitas')" data-nav="aktivitas" class="nav-btn touch-target !min-h-[48px] px-3.5 py-2 rounded-2xl font-bold text-sm sm:text-base whitespace-nowrap flex items-center gap-1.5 border-2 border-transparent">
          <span>🎯</span><span>Aktivitas</span>
        </button>
        <button onclick="navigateTo('game')" data-nav="game" class="nav-btn touch-target !min-h-[48px] px-3.5 py-2 rounded-2xl font-bold text-sm sm:text-base whitespace-nowrap flex items-center gap-1.5 border-2 border-transparent">
          <span>🎮</span><span>Game</span>
        </button>
        <button onclick="navigateTo('latihan')" data-nav="latihan" class="nav-btn touch-target !min-h-[48px] px-3.5 py-2 rounded-2xl font-bold text-sm sm:text-base whitespace-nowrap flex items-center gap-1.5 border-2 border-transparent">
          <span>📝</span><span>Latihan</span>
        </button>
        <button onclick="navigateTo('kuis')" data-nav="kuis" class="nav-btn touch-target !min-h-[48px] px-3.5 py-2 rounded-2xl font-bold text-sm sm:text-base whitespace-nowrap flex items-center gap-1.5 border-2 border-transparent">
          <span>❓</span><span>Kuis</span>
        </button>
        <button onclick="navigateTo('hasil')" data-nav="hasil" class="nav-btn touch-target !min-h-[48px] px-3.5 py-2 rounded-2xl font-bold text-sm sm:text-base whitespace-nowrap flex items-center gap-1.5 border-2 border-transparent">
          <span>🏆</span><span>Hasil</span>
        </button>
        <button onclick="navigateTo('refleksi')" data-nav="refleksi" class="nav-btn touch-target !min-h-[48px] px-3.5 py-2 rounded-2xl font-bold text-sm sm:text-base whitespace-nowrap flex items-center gap-1.5 border-2 border-transparent">
          <span>💭</span><span>Refleksi</span>
        </button>
        <button onclick="navigateTo('petunjuk')" data-nav="petunjuk" class="nav-btn touch-target !min-h-[48px] px-3.5 py-2 rounded-2xl font-bold text-sm sm:text-base whitespace-nowrap flex items-center gap-1.5 border-2 border-transparent">
          <span>📋</span><span>Petunjuk</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- KONTEN UTAMA DINAMIS -->
  <main id="appContent" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <!-- Konten dirender secara dinamis oleh JavaScript -->
  </main>

  <!-- FOOTER KONSISTEN DENGAN NAVIGASI CEPAT (Home, Back, Next) -->
  <footer class="bg-white border-t-2 border-sky-100 py-4 px-4 sm:px-6 mt-auto">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
        <button onclick="navigatePrev()" id="btnFooterPrev" class="touch-target px-5 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold flex items-center gap-2 border-2 border-slate-200">
          <span>⬅️</span><span>Sebelumnya</span>
        </button>
        <button onclick="navigateTo('beranda')" class="touch-target px-4 py-3 rounded-2xl bg-sky-100 text-sky-900 font-bold flex items-center gap-1.5 border-2 border-sky-200" title="Ke Beranda">
          <span>🏠</span><span class="hidden md:inline">Beranda</span>
        </button>
        <button onclick="navigateNext()" id="btnFooterNext" class="touch-target px-5 py-3 rounded-2xl btn-3d-teal font-bold flex items-center gap-2">
          <span>Selanjutnya</span><span>➡️</span>
        </button>
      </div>
      <div class="text-center sm:text-right text-sm text-slate-600 font-semibold">
        <span>Media Pembelajaran Interaktif • Disusun oleh <strong class="text-teal-700">Abu Rahmi</strong> (2026)</span>
      </div>
    </div>
  </footer>

  <!-- MODAL / KOTAK PESAN EDUKATIF (Pengganti alert/confirm) -->
  <div id="customModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-7 shadow-2xl border-4 border-teal-500 text-center page-enter">
      <div id="modalMascot" class="flex justify-center mb-3"></div>
      <h3 id="modalTitle" class="text-2xl font-bold text-slate-800 mb-2">Judul Pesan</h3>
      <p id="modalBody" class="text-slate-600 mb-6 text-base sm:text-lg"></p>
      <div id="modalActions" class="flex flex-wrap justify-center gap-3">
        <button onclick="closeModal()" class="touch-target px-6 py-3 rounded-2xl btn-3d-teal font-bold text-lg w-full">
          Baik, Mengerti! 👍
        </button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. STATE & DATA PEMBELAJARAN (KURIKULUM MERDEKA - PAI KELAS 4 BAB 1)
       ========================================================================== */
    const PAGES = ['beranda', 'materi', 'aktivitas', 'game', 'latihan', 'kuis', 'hasil', 'refleksi', 'petunjuk'];

    const defaultState = {
      currentPage: 'beranda',
      studentName: '',
      score: 0,
      soundEnabled: true,
      materiTab: 0,
      completedMateri: [false, false, false, false, false],
      hafalanChecked: [false, false, false, false, false],
      matchingSolved: [],
      puzzleSolved: false,
      gameHighScore: 0,
      latihanAnswers: {},
      kuisAnswers: {},
      kuisSubmitted: false,
      kuisStartTime: null,
      kuisDurationSec: 0,
      refleksi: {
        mood: '',
        liked: '',
        hardPart: '',
        nextGoal: ''
      }
    };

    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem('mpi_pai_kls4_bab1_v1');
        if (saved) {
          return { ...defaultState, ...JSON.parse(saved) };
        }
      } catch (e) {
        console.warn('Gagal memuat localStorage:', e);
      }
      return { ...defaultState };
    }

    function saveState() {
      try {
        localStorage.setItem('mpi_pai_kls4_bab1_v1', JSON.stringify(state));
        document.getElementById('globalScore').textContent = state.score;
      } catch (e) {
        console.warn('Gagal menyimpan localStorage:', e);
      }
    }

    function addScore(points) {
      state.score += points;
      saveState();
      const scoreEl = document.getElementById('globalScore');
      scoreEl.parentElement.classList.remove('anim-bounce');
      void scoreEl.parentElement.offsetWidth;
      scoreEl.parentElement.classList.add('anim-bounce');
    }

    /* ==========================================================================
       2. SISTEM AUDIO EDUKATIF (TONE.JS & WEB SPEECH API)
       ========================================================================== */
    let synth = null;

    function initAudio() {
      if (!synth && typeof Tone !== 'undefined') {
        synth = new Tone.PolySynth(Tone.Synth).toDestination();
      }
    }

    function playSfx(type) {
      if (!state.soundEnabled) return;
      try {
        initAudio();
        if (Tone.context.state !== 'running') {
          Tone.start();
        }
        const now = Tone.now();
        if (type === 'click') {
          synth.triggerAttackRelease('C5', '16n', now);
        } else if (type === 'success') {
          synth.triggerAttackRelease(['C5', 'E5', 'G5'], '8n', now);
          synth.triggerAttackRelease('C6', '4n', now + 0.15);
        } else if (type === 'error') {
          synth.triggerAttackRelease(['E4', 'Eb4'], '8n', now);
        } else if (type === 'fanfare') {
          synth.triggerAttackRelease('C5', '8n', now);
          synth.triggerAttackRelease('E5', '8n', now + 0.12);
          synth.triggerAttackRelease('G5', '8n', now + 0.24);
          synth.triggerAttackRelease('C6', '2n', now + 0.36);
        }
      } catch (e) {
        // Fallback diam jika audio diblokir browser
      }
    }

    function toggleAudio() {
      state.soundEnabled = !state.soundEnabled;
      updateAudioUI();
      saveState();
      if (state.soundEnabled) playSfx('click');
    }

    function updateAudioUI() {
      const icon = document.getElementById('soundIcon');
      const label = document.getElementById('soundLabel');
      if (icon) icon.textContent = state.soundEnabled ? '🔊' : '🔇';
      if (label) label.textContent = state.soundEnabled ? 'Suara Aktif' : 'Suara Mati';
    }

    function speakText(text, lang = 'id-ID') {
      playSfx('click');
      if (!state.soundEnabled) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    /* ==========================================================================
       3. KARAKTER MASKOT KONSISTEN (SVG VECTOR: ZAKI & HANA)
       ========================================================================== */
    function getMascotSVG(expression = 'senang', size = 110) {
      // Ekspresi: 'senang', 'berpikir', 'kaget', 'bangga'
      let mouth = `<path d="M42 63 Q50 71 58 63" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      let brow = `<path d="M36 46 Q41 43 45 46" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                  <path d="M55 46 Q59 43 64 46" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
      let badge = '';

      if (expression === 'berpikir') {
        mouth = `<circle cx="53" cy="64" r="3.5" fill="#1E293B"/>`;
        brow = `<path d="M36 44 Q41 41 45 45" stroke="#1E293B" stroke-width="2.5" fill="none"/>
                <path d="M55 47 Q59 45 64 47" stroke="#1E293B" stroke-width="2.5" fill="none"/>`;
        badge = `<text x="76" y="28" font-size="20">🤔</text>`;
      } else if (expression === 'kaget') {
        mouth = `<ellipse cx="50" cy="65" rx="5" ry="6" fill="#EF4444"/>`;
        brow = `<path d="M36 42 Q41 38 45 42" stroke="#1E293B" stroke-width="2.5" fill="none"/>
                <path d="M55 42 Q59 38 64 42" stroke="#1E293B" stroke-width="2.5" fill="none"/>`;
        badge = `<text x="76" y="28" font-size="20">✨</text>`;
      } else if (expression === 'bangga') {
        mouth = `<path d="M40 61 Q50 74 60 61 Z" fill="#EF4444" stroke="#1E293B" stroke-width="2"/>`;
        badge = `<text x="74" y="28" font-size="20">🌟</text>`;
      }

      return `
        <svg width="${size}" height="${size}" viewBox="0 0 100 100" class="shrink-0 drop-shadow-sm" aria-label="Maskot Zaki">
          <!-- Lingkaran Latar -->
          <circle cx="50" cy="50" r="46" fill="#CCFBF1" stroke="#0D9488" stroke-width="3"/>
          <!-- Baju Koko Biru Cerah -->
          <path d="M24 92 C24 75 76 75 76 92 Z" fill="#0284C7"/>
          <path d="M44 77 L50 86 L56 77" fill="#FFFFFF"/>
          <!-- Wajah -->
          <circle cx="50" cy="53" r="22" fill="#FDE68A"/>
          <!-- Pipi Merona -->
          <circle cx="37" cy="58" r="3.5" fill="#FCA5A5" opacity="0.7"/>
          <circle cx="63" cy="58" r="3.5" fill="#FCA5A5" opacity="0.7"/>
          <!-- Mata -->
          <circle cx="41" cy="51" r="3" fill="#1E293B"/>
          <circle cx="59" cy="51" r="3" fill="#1E293B"/>
          <circle cx="42" cy="50" r="1" fill="#FFFFFF"/>
          <circle cx="60" cy="50" r="1" fill="#FFFFFF"/>
          ${brow}
          ${mouth}
          <!-- Peci Hijau Toska -->
          <path d="M28 40 C28 24 72 24 72 40 Z" fill="#0F766E"/>
          <rect x="28" y="37" width="44" height="5" rx="2" fill="#F59E0B"/>
          ${badge}
        </svg>
      `;
    }

    /* ==========================================================================
       4. MODAL & NAVIGASI HALAMAN
       ========================================================================== */
    function showModal(title, body, expression = 'senang', customButtonsHTML = null) {
      document.getElementById('modalMascot').innerHTML = getMascotSVG(expression, 90);
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = body;
      const actions = document.getElementById('modalActions');
      if (customButtonsHTML) {
        actions.innerHTML = customButtonsHTML;
      } else {
        actions.innerHTML = `
          <button onclick="closeModal()" class="touch-target px-6 py-3 rounded-2xl btn-3d-teal font-bold text-lg w-full">
            Baik, Mengerti! 👍
          </button>
        `;
      }
      const modal = document.getElementById('customModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      playSfx('click');
      const modal = document.getElementById('customModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function navigateTo(page) {
      if (!PAGES.includes(page)) return;
      playSfx('click');
      state.currentPage = page;
      if (page === 'kuis' && !state.kuisSubmitted && !state.kuisStartTime) {
        state.kuisStartTime = Date.now();
      }
      saveState();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigatePrev() {
      const idx = PAGES.indexOf(state.currentPage);
      if (idx > 0) navigateTo(PAGES[idx - 1]);
    }

    function navigateNext() {
      const idx = PAGES.indexOf(state.currentPage);
      if (idx < PAGES.length - 1) navigateTo(PAGES[idx + 1]);
    }

    function updateNavHighlight() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const target = btn.getAttribute('data-nav');
        if (target === state.currentPage) {
          btn.className = 'nav-btn touch-target !min-h-[48px] px-3.5 py-2 rounded-2xl font-extrabold text-sm sm:text-base whitespace-nowrap flex items-center gap-1.5 bg-teal-600 text-white shadow-md border-2 border-teal-700';
        } else {
          btn.className = 'nav-btn touch-target !min-h-[48px] px-3.5 py-2 rounded-2xl font-bold text-sm sm:text-base whitespace-nowrap flex items-center gap-1.5 bg-slate-50 text-slate-700 hover:bg-sky-100 border-2 border-slate-200';
        }
      });

      const idx = PAGES.indexOf(state.currentPage);
      const prevBtn = document.getElementById('btnFooterPrev');
      const nextBtn = document.getElementById('btnFooterNext');
      if (prevBtn) prevBtn.disabled = idx === 0;
      if (prevBtn) prevBtn.style.opacity = idx === 0 ? '0.45' : '1';
      if (nextBtn) nextBtn.disabled = idx === PAGES.length - 1;
      if (nextBtn) nextBtn.style.opacity = idx === PAGES.length - 1 ? '0.45' : '1';
    }

    /* ==========================================================================
       5. RENDER HALAMAN 1: BERANDA (COVER + APERSEPSI & PEMANTIK)
       ========================================================================== */
    function renderBeranda() {
      return `
        <div class="space-y-8 page-enter">
          <!-- COVER UTAMA MEDIA PEMBELAJARAN -->
          <section class="relative overflow-hidden rounded-[28px] bg-gradient-to-br from-teal-600 via-teal-700 to-sky-800 text-white p-6 sm:p-10 shadow-xl border-4 border-teal-400/50">
            <!-- Dekorasi Motif Geometris Islami Lembut -->

        saveState();
      }
      navigateTo('materi');
    }

        addScore(10);

          'Masya Allah, Jawabanmu Tepat! (+10 Poin)',
          'Benar sekali! Perbedaan suku, bangsa, dan warna kulit adalah <strong>sunatullah</strong> (ketetapan Allah) agar kita <em>saling mengenal</em> (<em>litata\'ārafū</em>) dan mengagumi kebesaran Allah Swt. Yuk lanjut ke Materi!',

          'Mengejek teman yang berbeda justru dilarang oleh Allah Swt. dan Rasulullah saw. Coba pilih jawaban lain yang mencerminkan akhlak terpuji!',
          'berpikir'

       ========================================================================== */
    let penColor = '#0F172A';
    function setPenColor(color) {
      playSfx('click');
      penColor = color;
    }

    function initWritingCanvas() {
      const canvas = document.getElementById('writingCanvas');
      if (!canvas) return;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      let drawing = false;

      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - r.left, y: clientY - r.top };
      }

      function startDraw(e) {
        drawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }

      function draw(e) {
        if (!drawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.strokeStyle = penColor;
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }

      function endDraw() {
        drawing = false;
      }

      canvas.onmousedown = startDraw;
      canvas.onmousemove = draw;
      canvas.onmouseup = endDraw;
      canvas.onmouseleave = endDraw;

      canvas.ontouchstart = startDraw;
      canvas.ontouchmove = draw;
      canvas.ontouchend = endDraw;
    }

    function clearWritingCanvas() {
      playSfx('click');
      const canvas = document.getElementById('writingCanvas');
      if (!canvas) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

            <!-- Pilihan Potongan Acak -->
            ${!state.puzzleSolved ? `

        return;
      }
      if (selectedLeftMatch === rightId) {
        playSfx('success');
        if (!state.matchingSolved.includes(rightId)) {
          state.matchingSolved.push(rightId);
          addScore(10);
        }
        selectedLeftMatch = null;
        saveState();
        renderApp();
        if (state.matchingSolved.length === MATCHING_PAIRS.length) {
          showModal('Luar Biasa! Semua Cocok! (+50 Poin)', 'Kamu telah berhasil memasangkan seluruh lafal Q.S. Al-Ḥujurāt/49:13 dan Hadis Keragaman dengan artinya!', 'bangga');

        playSfx('error');
        selectedLeftMatch = null;
        renderApp();
        showModal('Belum Pas, Coba Lagi!', 'Perhatikan kata kuncinya ya! Misalnya <em>Litata\'ārafū</em> artinya saling mengenal. Yuk coba pasangkan lagi!', 'berpikir');

    function addPuzzlePiece(text) {
      playSfx('click');
      if (!userPuzzleOrder.includes(text)) {
        userPuzzleOrder.push(text);
        renderApp();
      }
    }

    function removePuzzlePiece(index) {
      playSfx('click');
      userPuzzleOrder.splice(index, 1);
      renderApp();
    }

    function resetPuzzleOrder() {
      playSfx('click');
      userPuzzleOrder = [];
      renderApp();
    }

    function checkPuzzleOrder() {
      if (userPuzzleOrder.length < PUZZLE_CORRECT.length) {
        showModal('Belum Lengkap!', 'Pilih semua 4 potongan ayat terlebih dahulu sebelum memeriksa jawabanmu ya!', 'berpikir');
        return;
      }
      const isCorrect = userPuzzleOrder.every((val, idx) => val === PUZZLE_CORRECT[idx]);
      if (isCorrect) {
        playSfx('fanfare');
        state.puzzleSolved = true;
        addScore(30);
        saveState();
        renderApp();
        showModal('Masya Allah, Urutan Sempurna! (+30 Poin)', 'Kamu sudah hafal alur bacaan Q.S. Al-Ḥujurāt/49:13 dari awal hingga akhir!', 'bangga');

    function startEduGame() {
      playSfx('click');
      gameActive = true;
      gameTimer = 30;
      gamePoints = 0;
      const overlay = document.getElementById('gameOverlay');
      if (overlay) overlay.classList.add('hidden');
      updateGameHUD();
      spawnGameBatch();

      clearInterval(gameInterval);
      clearInterval(spawnInterval);

      gameInterval = setInterval(() => {
        if (state.currentPage !== 'game') {
          stopEduGame(false);
          return;
        }
        gameTimer--;
        updateGameHUD();
        if (gameTimer <= 0) {
          stopEduGame(true);
        }
      }, 1000);

      spawnInterval = setInterval(() => {
        if (gameActive && state.currentPage === 'game') {
          spawnGameBatch();
        }
      }, 2800);
    }

    function spawnGameBatch() {
      const container = document.getElementById('gameCardsContainer');
      if (!container) return;
      const shuffled = [...GAME_ITEMS].sort(() => Math.random() - 0.5).slice(0, 6);
      container.innerHTML = shuffled.map((item, idx) => `
        <button 
          onclick="handleGameTap(this, ${item.good})" 
          class="touch-target p-4 rounded-2xl bg-white hover:bg-sky-50 border-2 border-sky-300 shadow-md flex items-center gap-3 text-left font-bold text-slate-800 page-enter">
          <span class="text-3xl shrink-0">${item.icon}</span>
          <span class="text-sm sm:text-base leading-snug">${item.text}</span>
        </button>
      `).join('');
    }

    function handleGameTap(btnEl, isGood) {
      if (!gameActive || btnEl.disabled) return;
      btnEl.disabled = true;
      if (isGood) {
        playSfx('success');
        gamePoints += 10;
        btnEl.className = 'touch-target p-4 rounded-2xl bg-green-500 text-white border-2 border-green-700 shadow-md flex items-center gap-3 text-left font-bold anim-bounce';
        btnEl.innerHTML = `<span class="text-2xl">✓</span><span>Benar! +10 Poin</span>`;
      } else {
        playSfx('error');
        gamePoints = Math.max(0, gamePoints - 5);
        btnEl.className = 'touch-target p-4 rounded-2xl bg-rose-500 text-white border-2 border-rose-700 shadow-md flex items-center gap-3 text-left font-bold anim-shake';
        btnEl.innerHTML = `<span class="text-2xl">✗</span><span>Sikap Tercela! -5</span>`;
      }
      updateGameHUD();
    }

    function updateGameHUD() {
      const tEl = document.getElementById('gameTimeDisplay');
      const sEl = document.getElementById('gameScoreDisplay');
      if (tEl) tEl.textContent = `${gameTimer}d`;
      if (sEl) sEl.textContent = gamePoints;
    }

    function stopEduGame(showResultModal) {
      gameActive = false;
      clearInterval(gameInterval);
      clearInterval(spawnInterval);
      if (gamePoints > state.gameHighScore) {
        state.gameHighScore = gamePoints;
      }
      if (gamePoints > 0) {
        addScore(Math.min(50, gamePoints));
      }
      saveState();
      if (showResultModal && state.currentPage === 'game') {
        playSfx('fanfare');
        renderApp();
        showModal(
          `Waktu Habis! Skor Game: ${gamePoints}`,

          'bangga'
        );
      }
    }

    function renderLatihan() {

                        let btnStyle = 'bg-white border-slate-200 hover:bg-sky-50 text-slate-800';
                        let prefix = ['A', 'B', 'C', 'D'][oIdx] + '.';

    function answerLatihan(qId, optIdx) {
      const qObj = LATIHAN_QUESTIONS.find(q => q.id === qId);
      if (!qObj) return;
      const isCorrect = optIdx === qObj.correct;
      const alreadySolved = state.latihanAnswers[qId] && state.latihanAnswers[qId].isCorrect;

      state.latihanAnswers[qId] = { selected: optIdx, isCorrect };
      if (isCorrect) {
        playSfx('success');
        if (!alreadySolved) addScore(10);
      } else {
        playSfx('error');
      }
      saveState();
      renderApp();
    }

              </div>

              <!-- Progress Bar Visual -->
              <div class="w-full h-4 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
                <div class="h-full bg-gradient-to-r from-teal-500 to-amber-400 transition-all duration-300" style="width: ${progressPct}%"></div>
              </div>
            </div>

            <!-- Daftar 10 Soal -->
            <div class="space-y-6">
              ${KUIS_QUESTIONS.map((item, idx) => {
                const chosen = state.kuisAnswers[idx];
                return `
                  <div class="p-5 rounded-3xl border-2 border-slate-200 bg-slate-50/40 space-y-3">
                    <div class="flex items-start gap-3">
                      <span class="w-9 h-9 rounded-xl bg-sky-600 text-white font-bold flex items-center justify-center shrink-0">${idx + 1}</span>
                      <p class="font-bold text-slate-800 text-base sm:text-lg">${item.q}</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      ${item.options.map((opt, oIdx) => {
                        let style = 'bg-white border-slate-200 hover:bg-sky-50 text-slate-800';
                        let badge = ['A', 'B', 'C', 'D'][oIdx];

                        if (!state.kuisSubmitted) {
                          if (chosen === oIdx) {
                            style = 'bg-teal-600 border-teal-700 text-white shadow-sm';
                          }
                        } else {
                          if (oIdx === item.correct) {
                            style = 'bg-green-600 border-green-700 text-white';
                            badge = '✓';
                          } else if (chosen === oIdx && chosen !== item.correct) {
                            style = 'bg-rose-500 border-rose-700 text-white';
                            badge = '✗';
                          } else {
                            style = 'bg-white border-slate-200 text-slate-400';
                          }
                        }

                        return `
                          <button 
                            onclick="selectKuisAnswer(${idx}, ${oIdx})" 
                            ${state.kuisSubmitted ? 'disabled' : ''}
                            class="touch-target p-3.5 rounded-2xl border-2 text-left font-bold flex items-center gap-3 ${style}">
                            <span class="w-8 h-8 rounded-lg bg-black/10 flex items-center justify-center shrink-0 text-sm">${badge}</span>
                            <span>${opt}</span>
                          </button>
                        `;
                      }).join('')}
                    </div>

                    ${state.kuisSubmitted ? `
                      <div class="p-3.5 rounded-2xl bg-sky-50 border border-sky-200 text-sm text-sky-950 font-semibold">
                        📘 <strong>Pembahasan:</strong> ${item.pembahasan}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Tombol Submit / Lihat Hasil -->
            <div class="mt-8 pt-6 border-t-2 border-slate-100 flex flex-wrap items-center justify-between gap-4">
              ${!state.kuisSubmitted ? `
                <button onclick="submitKuis()" class="touch-target w-full sm:w-auto px-8 py-4 rounded-2xl btn-3d-amber font-display font-bold text-xl">
                  🏁 Kumpulkan &amp; Lihat Nilai Kuis
                </button>
              ` : `
                <div class="flex flex-wrap gap-3 w-full sm:w-auto">
                  <button onclick="navigateTo('hasil')" class="touch-target px-6 py-4 rounded-2xl btn-3d-teal font-bold text-lg">
                    🏆 Lihat Rapor &amp; Lencana Hasil
                  </button>
                  <button onclick="retryKuis()" class="touch-target px-5 py-4 rounded-2xl bg-slate-100 text-slate-800 border-2 border-slate-300 font-bold">
                    🔄 Ulangi Kuis
                  </button>
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function selectKuisAnswer(qIdx, oIdx) {
      if (state.kuisSubmitted) return;
      playSfx('click');
      state.kuisAnswers[qIdx] = oIdx;
      saveState();
      renderApp();
    }

    function submitKuis() {
      const answeredCount = Object.keys(state.kuisAnswers).length;
      if (answeredCount < KUIS_QUESTIONS.length) {
        showModal(
          'Masih Ada Soal yang Kosong!',
          `Kamu baru menjawab <strong>${answeredCount} dari ${KUIS_QUESTIONS.length} soal</strong>. Yuk lengkapi semua soal terlebih dahulu sebelum dikumpulkan!`,
          'berpikir'
        );
        return;
      }

      state.kuisSubmitted = true;
      if (state.kuisStartTime) {
        state.kuisDurationSec = Math.max(10, Math.round((Date.now() - state.kuisStartTime) / 1000));
      }

      let correctCount = 0;
      KUIS_QUESTIONS.forEach((q, idx) => {
        if (state.kuisAnswers[idx] === q.correct) correctCount++;
      });

      addScore(correctCount * 10);
      saveState();
      playSfx('fanfare');
      renderApp();
      showModal(
        `Kuis Selesai! Nilai Kamu: ${correctCount * 10}`,
        `Kamu menjawab benar <strong>${correctCount} dari 10 soal</strong>! Yuk buka halaman <strong>Hasil</strong> untuk melihat lencana pencapaianmu.`,
        correctCount >= 7 ? 'bangga' : 'senang'
      );
    }

    function retryKuis() {
      playSfx('click');
      state.kuisAnswers = {};
      state.kuisSubmitted = false;
      state.kuisStartTime = Date.now();
      saveState();
      renderApp();
    }

    /* ==========================================================================
       11. RENDER HALAMAN 7: HASIL BELAJAR & LENCANA PENCAPAIAN
       ========================================================================== */
    function renderHasil() {
      let correctCount = 0;
      KUIS_QUESTIONS.forEach((q, idx) => {
        if (state.kuisAnswers[idx] === q.correct) correctCount++;
      });
      const kuisScore = state.kuisSubmitted ? correctCount * 10 : 0;
      const wrongCount = state.kuisSubmitted ? (10 - correctCount) : 0;

      let badgeTitle = 'Belum Mengerjakan Kuis';
      let badgeIcon = '⏳';
      let badgeDesc = 'Yuk kerjakan Kuis Akhir (10 soal) terlebih dahulu untuk mendapatkan lencana pencapaianmu!';
      let mascotExpr = 'berpikir';

      if (state.kuisSubmitted) {
        if (kuisScore >= 90) {
          badgeTitle = 'Luar Biasa! Duta Keragaman Teladan';
          badgeIcon = '👑';
          badgeDesc = 'Masya Allah! Pemahamanmu tentang Q.S. Al-Ḥujurāt/49:13 dan Hadis Keragaman sangat istimewa!';
          mascotExpr = 'bangga';
        } else if (kuisScore >= 70) {
          badgeTitle = 'Hebat! Sahabat Qur\'ani';
          badgeIcon = '🏅';
          badgeDesc = 'Alhamdulillah, kamu sudah mencapai ketuntasan belajar dengan baik. Pertahankan semangatmu!';
          mascotExpr = 'bangga';
        } else {
          badgeTitle = 'Tetap Semangat! Terus Berlatih';
          badgeIcon = '🌱';
          badgeDesc = 'Jangan berkecil hati! Yuk pelajari kembali bagian Materi yang belum dipahami lalu coba ulangi kuisnya.';
          mascotExpr = 'senang';
        }
      }

      return `
        <div class="space-y-6 page-enter">
          <div class="bg-white rounded-[28px] p-6 sm:p-8 shadow-md border-2 border-sky-100 text-center space-y-6">
            <div class="flex flex-col items-center">
              ${getMascotSVG(mascotExpr, 115)}
              <span class="mt-3 px-4 py-1 rounded-full bg-teal-100 text-teal-900 font-extrabold text-sm">
                Rapor Pencapaian Belajar • ${state.studentName || 'Peserta Didik Kelas 4'}
              </span>
              <h2 class="text-2xl sm:text-4xl font-bold text-slate-800 mt-2">${badgeIcon} ${badgeTitle}</h2>
              <p class="text-slate-600 max-w-xl mx-auto mt-1">${badgeDesc}</p>
            </div>

            <!-- Kartu Statistik Skor -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 max-w-4xl mx-auto">
              <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4">
                <span class="text-xs font-extrabold text-amber-800 uppercase">Nilai Kuis</span>
                <p class="font-display font-bold text-3xl sm:text-4xl text-amber-950 mt-1">${kuisScore}</p>
              </div>
              <div class="bg-green-50 border-2 border-green-300 rounded-2xl p-4">
                <span class="text-xs font-extrabold text-green-800 uppercase">Jawaban Benar</span>
                <p class="font-display font-bold text-3xl sm:text-4xl text-green-900 mt-1">${correctCount}</p>
              </div>
              <div class="bg-rose-50 border-2 border-rose-300 rounded-2xl p-4">
                <span class="text-xs font-extrabold text-rose-800 uppercase">Perlu Diperbaiki</span>
                <p class="font-display font-bold text-3xl sm:text-4xl text-rose-900 mt-1">${wrongCount}</p>
              </div>
              <div class="bg-sky-50 border-2 border-sky-300 rounded-2xl p-4">
                <span class="text-xs font-extrabold text-sky-800 uppercase">Total Bintang</span>
                <p class="font-display font-bold text-3xl sm:text-4xl text-sky-950 mt-1">⭐ ${state.score}</p>
              </div>
            </div>

            <!-- Rekomendasi Belajar Jika Skor Rendah -->
            ${state.kuisSubmitted && kuisScore < 70 ? `
              <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-5 max-w-2xl mx-auto text-left">
                <h4 class="font-bold text-amber-950 text-lg mb-2">📌 Rekomendasi Penguatan Belajar:</h4>
                <ul class="space-y-1.5 text-amber-900 text-sm sm:text-base font-semibold">
                  <li>• Baca ulang <strong>Bagian B (Pesan Pokok)</strong> dan <strong>Bagian E (Hadis Keragaman)</strong>.</li>
                  <li>• Mainkan kembali <strong>Aktivitas Matching</strong> untuk memperkuat pemahaman arti lafal.</li>
                </ul>
              </div>
            ` : ''}

            <!-- Ringkasan Materi yang Sudah Dipelajari -->
            <div class="bg-teal-50/70 border-2 border-teal-200 rounded-3xl p-5 max-w-3xl mx-auto text-left">
              <h3 class="font-bold text-teal-950 text-lg mb-3">📚 Ringkasan Inti Bab 1:</h3>
              <ul class="space-y-2 text-slate-700 text-sm sm:text-base font-semibold">
                <li>✅ <strong>Q.S. Al-Ḥujurāt/49:13</strong> menegaskan bahwa manusia diciptakan berbangsa-bangsa dan bersuku-suku agar <em>saling mengenal</em> (<em>litata'ārafū</em>).</li>
                <li>✅ Ukuran kemuliaan manusia di sisi Allah Swt. bukanlah rupa atau harta, melainkan <strong>ketakwaan</strong>.</li>
                <li>✅ <strong>Hadis tentang Keragaman</strong> mengajarkan bahwa Allah Swt. melihat <strong>hati</strong> dan <strong>amal perbuatan</strong> setiap hamba-Nya.</li>
              </ul>
            </div>

            <div class="flex flex-wrap justify-center gap-4 pt-2">
              <button onclick="navigateTo('refleksi')" class="touch-target px-7 py-4 rounded-2xl btn-3d-amber font-bold text-lg">
                💭 Lanjut ke Refleksi Diri ➡️
              </button>
              ${!state.kuisSubmitted ? `
                <button onclick="navigateTo('kuis')" class="touch-target px-7 py-4 rounded-2xl btn-3d-teal font-bold text-lg">
                  ❓ Kerjakan Kuis Sekarang
                </button>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       12. RENDER HALAMAN 8: REFLEKSI PESERTA DIDIK & PENUTUP MOTIVASI
       ========================================================================== */
    function renderRefleksi() {
      const moods = [
        { emoji: '🤩', label: 'Sangat Senang & Paham' },
        { emoji: '😊', label: 'Senang Belajar' },
        { emoji: '🤔', label: 'Masih Perlu Latihan' }
      ];

      return `
        <div class="space-y-8 page-enter">
          <!-- ASESMEN AS LEARNING: REFLEKSI DIRI -->
          <section class="bg-white rounded-[28px] p-6 sm:p-8 shadow-md border-2 border-sky-100 space-y-6">
            <div class="flex items-center gap-4">
              ${getMascotSVG('senang', 85)}
              <div>
                <span class="px-3.5 py-1 rounded-full bg-purple-100 text-purple-900 font-extrabold text-xs">Asesmen As Learning</span>
                <h2 class="text-2xl sm:text-3xl font-bold text-slate-800 mt-1">💭 Refleksi Diri Peserta Didik</h2>
                <p class="text-slate-600 text-sm sm:text-base">Ceritakan pengalaman belajarmu hari ini dengan jujur dan gembira!</p>
              </div>
            </div>

            <!-- 1. Pilih Perasaan -->
            <div class="space-y-3">
              <label class="block font-bold text-slate-800 text-lg">1. Bagaimana perasaanmu setelah mempelajari Q.S. Al-Ḥujurāt/49:13 &amp; Hadis Keragaman?</label>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                ${moods.map(m => `
                  <button onclick="setRefleksiMood('${m.label}')" class="touch-target p-4 rounded-2xl border-2 font-bold flex items-center justify-center gap-3 ${state.refleksi.mood === m.label ? 'bg-teal-600 text-white border-teal-700 shadow-md' : 'bg-sky-50 border-sky-200 text-slate-800 hover:bg-sky-100'}">
                    <span class="text-3xl">${m.emoji}</span>
                    <span>${m.label}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- 2. Isian Refleksi Singkat -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="space-y-1.5">
                <label class="block font-bold text-slate-700 text-sm">2. Apa yang paling kamu sukai?</label>
                <textarea rows="3" onchange="updateRefleksiField('liked', this.value)" placeholder="Contoh: Game keragaman dan audio ayat..." class="w-full p-3.5 rounded-2xl border-2 border-slate-200 focus:border-teal-500 focus:outline-none text-slate-800">${state.refleksi.liked}</textarea>
              </div>
              <div class="space-y-1.5">
                <label class="block font-bold text-slate-700 text-sm">3. Bagian mana yang masih terasa sulit?</label>
                <textarea rows="3" onchange="updateRefleksiField('hardPart', this.value)" placeholder="Contoh: Menghafal hukum tajwid..." class="w-full p-3.5 rounded-2xl border-2 border-slate-200 focus:border-teal-500 focus:outline-none text-slate-800">${state.refleksi.hardPart}</textarea>
              </div>
              <div class="space-y-1.5">
                <label class="block font-bold text-slate-700 text-sm">4. Sikap baik apa yang akan kamu lakukan?</label>
                <textarea rows="3" onchange="updateRefleksiField('nextGoal', this.value)" placeholder="Contoh: Menghormati semua teman di kelas..." class="w-full p-3.5 rounded-2xl border-2 border-slate-200 focus:border-teal-500 focus:outline-none text-slate-800">${state.refleksi.nextGoal}</textarea>
              </div>
            </div>

            <button onclick="saveRefleksiAction()" class="touch-target px-7 py-4 rounded-2xl btn-3d-teal font-bold text-lg">
              💌 Simpan Refleksi &amp; Dapatkan Pesan Motivasi
            </button>
          </section>

          <!-- PENUTUP & MOTIVASI HANGAT -->
          <section class="rounded-[28px] bg-gradient-to-r from-teal-700 to-sky-800 text-white p-6 sm:p-8 shadow-lg border-4 border-teal-400/40 flex flex-col md:flex-row items-center gap-6">
            ${getMascotSVG('bangga', 115)}
            <div class="space-y-3 flex-1 text-center md:text-left">
              <h3 class="text-2xl sm:text-3xl font-bold text-amber-300">
                Barakallahu Fiikum, ${state.studentName || 'Anak Hebat'}! 🌟
              </h3>
              <p class="text-sky-100 text-base sm:text-lg">
                Terima kasih telah belajar dengan penuh semangat! Mari biasakan membaca Al-Qur'an dengan tartil setiap hari serta menghargai setiap perbedaan teman sebagai anugerah terindah dari Allah Swt.
              </p>
              <div class="pt-2 flex flex-wrap justify-center md:justify-start gap-3">
                <button onclick="confirmResetAll()" class="touch-target px-5 py-3 rounded-2xl bg-white/20 hover:bg-white/30 text-white border-2 border-white/40 font-bold">
                  🔄 Ulangi Media dari Awal
                </button>
                <button onclick="navigateTo('beranda')" class="touch-target px-5 py-3 rounded-2xl btn-3d-amber font-bold">
                  🏠 Kembali ke Menu Utama
                </button>
              </div>
              <p class="text-xs text-sky-200 pt-2">
                Dikembangkan oleh <strong>Abu Rahmi</strong> • Tahun 2026 • Pendidikan Agama Islam SD Kelas 4
              </p>
            </div>
          </section>
        </div>
      `;
    }

    function setRefleksiMood(label) {
      playSfx('click');
      state.refleksi.mood = label;
      saveState();
      renderApp();
    }

    function updateRefleksiField(key, val) {
      state.refleksi[key] = val;
      saveState();
    }

    function saveRefleksiAction() {
      playSfx('success');
      addScore(15);
      saveState();
      showModal(
        'Terima Kasih atas Refleksimu! (+15 Poin)',
        `Alhamdulillah, kesadaranmu dalam belajar sungguh membanggakan! Teruslah menjadi anak yang bertakwa dan menyayangi sesama tanpa membeda-bedakan.`,
        'bangga'
      );
    }

    function confirmResetAll() {
      showModal(
        'Ulangi Media dari Awal?',
        'Semua skor, jawaban latihan, dan progres kuis akan diatur ulang menjadi nol agar kamu bisa belajar dari awal lagi.',
        'berpikir',
        `
          <button onclick="executeResetAll()" class="touch-target px-5 py-3 rounded-2xl bg-rose-600 text-white font-bold flex-1">
            Ya, Ulangi Semua
          </button>
          <button onclick="closeModal()" class="touch-target px-5 py-3 rounded-2xl bg-slate-200 text-slate-800 font-bold flex-1">
            Batal
          </button>
        `
      );
    }

    function executeResetAll() {
      localStorage.removeItem('mpi_pai_kls4_bab1_v1');
      state = { ...defaultState };
      saveState();
      closeModal();
      renderApp();
    }

    /* ==========================================================================
       13. RENDER HALAMAN 9: PETUNJUK PENGGUNAAN MEDIA
       ========================================================================== */
    function renderPetunjuk() {
      const guides = [
        { icon: '🏠', title: 'Beranda', desc: 'Halaman sampul, pengisian nama siswa, dan pertanyaan pemantik awal.' },
        { icon: '📖', title: 'Materi', desc: 'Terdiri dari 5 bagian (A–E) dilengkapi audio pelafalan ayat dan papan latihan menulis.' },
        { icon: '🎯', title: 'Aktivitas', desc: 'Permainan mencocokkan kosa kata dan menyusun urutan potongan Q.S. Al-Ḥujurāt/49:13.' },
        { icon: '🎮', title: 'Game', desc: 'Game interaktif 30 detik menangkap sikap terpuji dalam keragaman.' },
        { icon: '📝', title: 'Latihan', desc: '5 soal latihan formatif dengan petunjuk korektif jika jawaban belum tepat.' },
        { icon: '❓', title: 'Kuis', desc: '10 soal evaluasi akhir dengan penilaian otomatis dan pembahasan lengkap.' },
        { icon: '🏆', title: 'Hasil', desc: 'Rapor pencapaian skor, lencana penghargaan, dan ringkasan materi.' },
        { icon: '💭', title: 'Refleksi', desc: 'Catatan refleksi perasaan dan komitmen sikap baik peserta didik.' }
      ];

      return `
        <div class="space-y-6 page-enter">
          <div class="bg-white rounded-[28px] p-6 sm:p-8 shadow-md border-2 border-sky-100 space-y-6">
            <div class="flex items-center gap-4">
              ${getMascotSVG('senang', 90)}
              <div>
                <span class="px-3.5 py-1 rounded-full bg-teal-100 text-teal-900 font-extrabold text-xs">Panduan Pengguna</span>
                <h2 class="text-2xl sm:text-3xl font-bold text-slate-800 mt-1">📋 Petunjuk Penggunaan Media</h2>
                <p class="text-slate-600 text-sm sm:text-base">Media ini dirancang ramah sentuhan untuk <strong>Papan Interaktif (FID)</strong>, <strong>Laptop/Desktop</strong>, maupun <strong>Smartphone/Tablet</strong>.</p>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              ${guides.map(g => `
                <div class="p-4 rounded-2xl bg-sky-50/70 border-2 border-sky-100 space-y-1.5">
                  <div class="text-3xl">${g.icon}</div>
                  <h3 class="font-bold text-slate-800 text-lg">${g.title}</h3>
                  <p class="text-slate-600 text-sm">${g.desc}</p>
                </div>
              `).join('')}
            </div>

            <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-5 text-sm sm:text-base text-amber-950 font-semibold">
              ℹ️ <strong>Informasi Penyusun:</strong> Media Pembelajaran Interaktif ini disusun oleh <strong>Abu Rahmi</strong> untuk mata pelajaran Pendidikan Agama Islam dan Budi Pekerti SD Kelas 4 (Kurikulum Merdeka - Fase B).
            </div>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       14. RENDERER UTAMA & INISIALISASI APLIKASI
       ========================================================================== */
    function renderApp() {
      if (state.currentPage !== 'game' && gameActive) {
        stopEduGame(false);
      }

      const container = document.getElementById('appContent');
      switch (state.currentPage) {
        case 'beranda': container.innerHTML = renderBeranda(); break;
        case 'materi': container.innerHTML = renderMateri(); break;
        case 'aktivitas': container.innerHTML = renderAktivitas(); break;
        case 'game': container.innerHTML = renderGame(); break;
        case 'latihan': container.innerHTML = renderLatihan(); break;
        case 'kuis': container.innerHTML = renderKuis(); break;
        case 'hasil': container.innerHTML = renderHasil(); break;
        case 'refleksi': container.innerHTML = renderRefleksi(); break;
        case 'petunjuk': container.innerHTML = renderPetunjuk(); break;
        default: container.innerHTML = renderBeranda();
      }

      updateNavHighlight();
      updateAudioUI();
      document.getElementById('globalScore').textContent = state.score;

      if (state.currentPage === 'materi' && state.materiTab === 2) {
        setTimeout(initWritingCanvas, 50);
      }
    }

    window.addEventListener('resize', () => {
      if (state.currentPage === 'materi' && state.materiTab === 2) {
        initWritingCanvas();
      }
    });

    window.onload = function () {
      renderApp();
    };
  </script>
</body>
</html>
